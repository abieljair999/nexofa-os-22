<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexofa OS 22.0 - Bootloader</title>
  <link rel="stylesheet" href="css/nexofa.css">
</head>
<body>

  <!-- Boot Screen -->
  <div id="boot-screen" class="boot-screen">
    <div class="boot-container">
      <div class="boot-logo">
        <svg viewBox="0 0 100 100" width="80" height="80">
          <defs>
            <linearGradient id="nexoGradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#657cff"/>
              <stop offset="55%" stop-color="#8b5cf6"/>
              <stop offset="100%" stop-color="#43d9ff"/>
            </linearGradient>
          </defs>
          <path d="M50 7 L87 28 L87 72 L50 93 L13 72 L13 28 Z" fill="none" stroke="url(#nexoGradient)" stroke-width="7" stroke-linejoin="round"/>
          <path d="M30 67 L30 34 L70 66 L70 33" fill="none" stroke="url(#nexoGradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="boot-title">Nexofa OS <span>22.0</span></h1>
      <h2 class="boot-subtitle">Bootloader</h2>
      <div class="boot-checks" id="boot-checks"></div>
      <div class="boot-progress">
        <div class="boot-progress-bar" id="boot-progress-bar"></div>
      </div>
      <p class="boot-status" id="boot-status">Initializing...</p>
    </div>
  </div>

  <!-- Desktop Shell -->
  <div id="desktop" class="desktop hidden">
    <!-- Topbar -->
    <div id="topbar" class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">
          <svg viewBox="0 0 100 100" width="24" height="24">
            <defs>
              <linearGradient id="topbarGradient" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#657cff"/>
                <stop offset="100%" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
            <path d="M50 7 L87 28 L87 72 L50 93 L13 72 L13 28 Z" fill="none" stroke="url(#topbarGradient)" stroke-width="7" stroke-linejoin="round"/>
          </svg>
          <span>Nexofa</span>
        </div>
      </div>
      <div class="topbar-center" id="topbar-time">00:00</div>
      <div class="topbar-right">
        <button class="topbar-btn" id="btn-quick" title="Quick Controls">⚙️</button>
      </div>
    </div>

    <!-- Desktop Icons -->
    <div class="desktop-icons" id="desktop-icons"></div>

    <!-- Dock -->
    <div id="dock" class="dock"></div>

    <!-- Quick Settings Panel -->
    <div id="quick-panel" class="panel hidden">
      <div class="panel-title">Quick Settings</div>
      <div class="panel-content" id="quick-content"></div>
    </div>

    <!-- Notifications Panel -->
    <div id="notifications-panel" class="panel notifications-panel hidden">
      <div class="panel-title">Notifications</div>
      <div class="panel-content" id="notifications-list"></div>
    </div>
  </div>

  <!-- Modal/Window Container -->
  <div id="window-container"></div>

  <!-- Scripts - Load in order -->
  <script src="js/storage.js"></script>
  <script src="js/core.js"></script>
  <script src="js/runtime.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/bootloader.js"></script>

</body>
</html>
